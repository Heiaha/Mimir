[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "fen-parser"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.maturin]
module-name = "fen_parser"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "src/**/*.rs" }]
