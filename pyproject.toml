[project]
name = "mimir"
version = "0.1.0"
description = "NNUE training suite for the Weiawaga chess engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chess~=1.10.0",
    "fen-parser",
    "matplotlib~=3.11.2",
    "numpy~=2.5.4",
    "polars~=2.1.0",
    "PyYAML~=6.0.3",
    "seaborn~=0.13.2",
    "torch~=2.14.1",
    "tqdm~=4.70.1",
]

[dependency-groups]
dev = ["ipykernel>=7.3.0"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
fen-parser = { path = "fen_parser" }
torch = { index = "pytorch-cu130" }
